site_name: LLM Infra Atlas
site_description: LLM Infra 深度笔记：从算法定义到生产系统与源码实现
site_url: https://llm-infra-atlas.github.io/
repo_url: https://github.com/llm-infra-atlas/llm-infra-atlas.github.io
repo_name: llm-infra-atlas/llm-infra-atlas.github.io
edit_uri: edit/main/docs/

nav:
  - 首页: index.md
  - 模型与算子:
      - 前沿开源模型架构速览: frontier_open_models.md
      - Attention:
          - attention/README.md
          - 基础：Q/K/V、softmax 与 KV cache: attention/00_attention_basics.md
          - Attention 机制:
              - attention/mechanisms/README.md
              - 基础：MHA / MQA / GQA / MLA: attention/mechanisms/01_basics_head_sharing.md
              - 位置编码与数值稳定: attention/mechanisms/02_position_and_stability.md
              - sparse 路线（一）：静态稀疏与推理期动态稀疏: attention/mechanisms/03_sparse_static.md
              - sparse 路线（二）：可训练稀疏: attention/mechanisms/04_sparse_trainable.md
              - sparse 路线（三）：DSA / CSA / HCA: attention/mechanisms/05_sparse_dsa_frontier.md
              - linear 路线（一）：三种计算形式: attention/mechanisms/06_linear_foundation.md
              - linear 路线（二）：衰减机制: attention/mechanisms/07_linear_decay_gating.md
              - linear 路线（三）：delta rule / DPLR: attention/mechanisms/08_linear_delta_rule.md
              - linear 路线（四）：KDA 与 Kimi Linear: attention/mechanisms/09_linear_kda_kimi.md
              - gated attention: attention/mechanisms/10_gating.md
              - hybrid：层比例与 NoPE: attention/mechanisms/11_hybrid.md
          - FlashAttention:
              - attention/fa/README.md
              - IO-awareness 与 online softmax: attention/fa/01_io_awareness_online_softmax.md
              - FA2：并行度与 work partitioning: attention/fa/02_fa2_parallelism.md
              - FA3：Hopper 上的异步化与 overlap: attention/fa/03_fa3_hopper_async.md
              - FA4（CuTeDSL）与工程接口: attention/fa/04_fa4_cutedsl_and_api.md
              - Flash sparse attention: attention/fa/05_flash_sparse_attention.md
              - Flash linear attention: attention/fa/06_flash_linear_attention.md
      - MoE:
          - moe/README.md
          - MoE 基础与关键组件: moe/01_basics_and_components.md
          - 细粒度 MoE: moe/02_fine_grained.md
          - LatentMoE: moe/03_latentmoe.md
          - 训练中的负载均衡调控: moe/04_load_balancing.md
          - Grouped GEMM: moe/05_grouped_gemm.md
          - DeepEP: moe/06_deepep.md
          - MegaMoE: moe/07_megamoe.md
      - 多模态:
          - multimodal/README.md
          - 术语定义: multimodal/00_definitions.md
          - 对比预训练: multimodal/01_contrastive_pretrain.md
          - Encoder: multimodal/02_encoders.md
          - 经典 VLM: multimodal/03_classic_vlms.md
          - 融合与 connector: multimodal/04_fusion_and_connectors.md
          - 生成器: multimodal/05_generation.md
          - 异构与 stage 解耦: multimodal/06_heterogeneity_and_disaggregation.md
          - 变长输入与负载均衡: multimodal/07_variable_length_load_balancing.md
          - 冗余、显存与缓存: multimodal/08_caching_redundancy_memory.md
      - Residual:
          - residual/README.md
          - Identity skip 与 Norm 放置: residual/00_identity_skip_and_norm.md
          - Hyper-Connections / mHC: residual/01_hyper_connections.md
