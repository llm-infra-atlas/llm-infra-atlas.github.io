              - PPO: post_train/algorithms/02_ppo.md
              - GRPO family: post_train/algorithms/03_grpo_family.md
              - On-policy distillation (OPD): post_train/algorithms/04_opd.md
          - System:
              - post_train/infra/README.md
              - Framework mapping: post_train/infra/01_framework_mapping.md
              - Rollout-train flow: post_train/infra/02_rollout_train_architecture.md
              - Async / partial rollout: post_train/infra/03_async_partial_rollout.md
              - Consistency / determinism: post_train/infra/04_consistency_determinism.md
              - Weight conversion: post_train/infra/05_weight_sync.md
              - Agentic RL: post_train/infra/06_agentic_rl.md
      - 低精度:
          - low_precision/README.md
          - Formats / scaling: low_precision/00_formats_and_scaling.md
          - DeepSeek FP8: low_precision/01_deepseek_fp8_hopper.md
          - Blackwell FP4/FP8: low_precision/02_blackwell_mxfp_nvfp4.md
      - Agent:
          - agent/README.md
          - Definitions: agent/00_definitions.md
          - Loop / tools: agent/01_loop_and_tool_use.md
          - Classic works: agent/02_classic_works.md
          - DeepSeek Harness: agent/03_deepseek_harness.md
          - Sandbox / AgentENV: agent/04_sandbox_and_agentenv.md
  - 底层技术:
      - HPC · 集群与网络:
          - hpc/README.md
          - GPU hardware: hpc/00_gpu_hw_params.md
          - Roofline model: hpc/00_roofline_model.md
          - Scale-up / 超节点: hpc/01_scale_up_nvlink_nvl72.md
          - Scale-out topology: hpc/02_scale_out_topology_planes.md
          - RDMA / IB verbs: hpc/03_rdma_ib_verbs.md
          - Collectives: hpc/04_collectives.md
          - Reliability: hpc/05_reliability_at_scale.md
      - PyTorch:
          - torch/README.md
          - Tensor / memory layout: torch/01_tensor_memory_layout.md
          - Compute ops: torch/02_compute_ops.md
          - Autograd: torch/03_autograd.md
          - Distributed: torch/04_distributed.md
          - CUDA streams / AMP: torch/05_cuda_streams_memory_amp.md
          - Caching allocator: torch/06_caching_allocator.md
          - CUDA Graph: torch/07_cuda_graph.md
          - Compile / profiler: torch/08_compile_profiler.md
      - Profiling:
          - profiling/README.md
          - Timeline tracing: profiling/01_timeline_tracing.md
          - Memory profiling: profiling/02_memory_profiling.md
          - Nsight Compute: profiling/03_nsight_compute.md
      - CUDA & DSL:
          - cuda_dsl/README.md

theme:
  name: material
  language: zh
  logo: assets/images/favicon-512.webp
  favicon: assets/images/favicon.ico
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
    - navigation.sections
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search:
      lang:
        - zh
        - en

hooks:
  - hooks/root_assets.py
  - hooks/source_links.py
  - hooks/homepage_links.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - assets/javascripts/mathjax.js
  # 自托管的 MathJax 3.2.2（含 CHTML 字体，见 assets/javascripts/mathjax/），不依赖 CDN
  - assets/javascripts/mathjax/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/custom.css
  - assets/stylesheets/navigation.css

exclude_docs: |
  **/_build_nb.py
  **/*.ipynb
  **/src/**

strict: true

